      + '<button class="mode-btn secondary" id="btnDictation" style="flex:1;min-width:55px">听写</button>'
      + '<button class="mode-btn secondary" id="btnWordRecite" style="flex:1;min-width:55px">背诵</button>'
      + '</div>'
      + '<div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">'
      + '<button class="mode-btn secondary" id="btnWordGame" style="flex:1;min-width:55px">闯关</button>'
      + '<button class="mode-btn secondary" id="btnWordBook" style="flex:1;min-width:55px">生词本(' + wordBook.length + ')</button>'
      + '</div>'
      + '<div id="wordSubContent"></div>';

    // ========== 单词列表 (按单元分组) ==========
    const showWordList = () => {
      document.getElementById('btnWordList').className = 'mode-btn primary';
      document.getElementById('btnDictation').className = 'mode-btn secondary';
      document.getElementById('btnWordRecite').className = 'mode-btn secondary';
      document.getElementById('btnWordBook').className = 'mode-btn secondary';

      let html2 = '';
      book.units.forEach((unit, ui) => {
        const isFirst = false;
        html2 += '<div class="unit-word-group">';
        html2 += '<div class="unit-word-header" data-unit-idx="' + ui + '">';
        html2 += '<span class="collapse-arrow' + (isFirst ? ' open' : '') + '">&#9654;</span>';
        html2 += '<span class="unit-name">' + unit.name + '</span>';
        html2 += '<span class="unit-count">' + unit.words.length + ' 词</span>';
        html2 += '</div>';
        html2 += '<div class="unit-word-body' + (isFirst ? ' open' : '') + '" data-unit-body="' + ui + '">';
        unit.words.forEach((w, wi) => {
          const inBook = wordBook.some(wb => wb.en === w.en);
          html2 += '<div class="word-item" data-en="' + w.en + '" data-unit-idx="' + ui + '">';
          html2 += '<div class="word-play" data-word="' + w.en + '">';
          html2 += '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>';
          html2 += '</div>';
          html2 += '<div style="flex:1;min-width:0">';
          html2 += '<div class="word-en">' + w.en + '</div>';
          html2 += '<div class="word-phonetic">' + w.phonetic + '</div>';
          html2 += '</div>';
          html2 += '<div class="word-zh">' + w.zh + '</div>';
          html2 += inBook ? '<span style="font-size:12px;color:var(--green);flex-shrink:0">已收藏</span>'
            : '<button class="mode-btn secondary" style="font-size:11px;padding:4px 8px;flex-shrink:0" data-add="' + w.en + '">+生词本</button>';
          html2 += '</div>';
        });
        html2 += '</div></div>';
      });

      document.getElementById('wordSubContent').innerHTML = html2;

      // 折叠/展开
      document.querySelectorAll('.unit-word-header').forEach(hdr => {
        hdr.addEventListener('click', function(e) {
          if (e.target.closest('.word-checkbox')) return;
          const ui = this.dataset.unitIdx;
          const arrow = this.querySelector('.collapse-arrow');
          const body = document.querySelector('[data-unit-body="' + ui + '"]');
          const isOpen = body.classList.contains('open');
          if (isOpen) { arrow.classList.remove('open'); body.classList.remove('open'); }
          else { arrow.classList.add('open'); body.classList.add('open'); }
        });
      });

      // 发音
      document.querySelectorAll('.word-play').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          AudioEngine.speakWord(this.dataset.word);
        });
      });

      // 单词行点击发音
      document.querySelectorAll('.word-item').forEach(item => {
        item.addEventListener('click', function(e) {
          if (e.target.closest('.word-checkbox') || e.target.closest('button')) return;
          AudioEngine.speakWord(this.dataset.en);
        });
      });

      // 生词本
      document.querySelectorAll('[data-add]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const en = this.dataset.add;
          const w = allWords.find(x => x.en === en);
          if (w && Store.addToWordBook(w)) {
            UI.toast('已添加到生词本');
            showWordList();
          }
        });
      });
    };

    // ========== 获取选中的单词 ==========
    const getSelectedWords = () => {
      const selected = [];
      document.querySelectorAll('.word-check:checked').forEach(cb => {
        const en = cb.dataset.en;
        const w = allWords.find(x => x.en === en);
        if (w) selected.push(w);
      });
      return selected;
    };

    // ========== 渲染字母键盘 HTML ==========
    const renderKeyboardHtml = () => {
      const rows = [
        ['q','w','e','r','t','y','u','i','o','p'],
        ['a','s','d','f','g','h','j','k','l'],
        ['z','x','c','v','b','n','m']
      ];
      let kb = '<div class="custom-keyboard">';
      rows.forEach(row => {
        kb += '<div class="keyboard-row">';
        row.forEach(ch => {
          kb += '<button class="key-btn key-letter" data-letter="' + ch + '">' + ch.toUpperCase() + '</button>';
        });
        kb += '</div>';
      });
      kb += '<div class="keyboard-row">';
      kb += '<button class="key-btn special delete" id="keyDelete">&#x232B; 删除</button>';
      kb += '<button class="key-btn special confirm" id="keyConfirm">确认 &#x2713;</button>';
      kb += '</div></div>';
      return kb;
    };

    // ========== 听写模式 (逐词 + 自定义键盘) ==========
    const showDictation = () => {
      document.getElementById('btnWordList').className = 'mode-btn secondary';
      document.getElementById('btnDictation').className = 'mode-btn primary';
      document.getElementById('btnWordGame').className = 'mode-btn secondary';
      document.getElementById('btnWordRecite').className = 'mode-btn secondary';
      document.getElementById('btnWordBook').className = 'mode-btn secondary';

      // 获取当前已勾选的单词
      let selectedWords = getSelectedWords();
      if (selectedWords.length === 0) { selectedWords = allWords.slice(0, 20); }

      let dictIdx = 0;
      let currentInput = '';
      let dictState = 'select'; // 'select' | 'playing' | 'feedback' | 'finished'
      let userResults = [];     // { word, answer, correct }

      const speakCurrentWord = () => {
        if (dictIdx < selectedWords.length) {
          AudioEngine.speakWord(selectedWords[dictIdx].en);
        }
      };

      const renderDict = () => {
        const sub = document.getElementById('wordSubContent');
        let body = '';

        if (dictState === 'select') {
          // 选词界面
          body = '<div class="section-title">选择听写单元和单词</div>';
          book.units.forEach((unit, ui) => {
            body += '<div class="dict-select-unit">';
            body += '<div class="dict-select-unit-header" data-dsu="' + ui + '">';
            body += '<input type="checkbox" class="word-checkbox dict-unit-check" data-dsu="' + ui + '" style="width:18px;height:18px">';
            body += '<span>' + unit.name + '</span>';
            body += '<span style="font-size:12px;color:var(--text-tertiary)">' + unit.words.length + '词</span>';
            body += '<span class="arrow">&#9654;</span>';
            body += '</div>';
            body += '<div class="dict-select-words" data-dsw="' + ui + '">';
            unit.words.forEach(w => {
              body += '<div class="dict-select-word-item">';
              body += '<input type="checkbox" class="word-checkbox dict-word-check" data-en="' + w.en + '" data-unit="' + ui + '" style="width:18px;height:18px">';
              body += '<span style="flex:1">' + w.en + '</span>';
              body += '<span style="font-size:12px;color:var(--text-tertiary)">' + w.zh + '</span>';
              body += '</div>';
            });
            body += '</div></div>';
          });
          body += '<div class="dict-selected-count" id="dictSelCount">已选 0 / ' + allWords.length + ' 个单词</div>';
          body += '<button class="mode-btn primary" id="btnStartDict" style="width:100%;padding:14px" disabled>请先选择单词</button>';

          sub.innerHTML = body;

          // 更新选中计数
          const updateSelectCount = () => {
            let count = 0;
            document.querySelectorAll('.dict-word-check:checked').forEach(() => count++);
            const selEl = document.getElementById('dictSelCount');
            if (selEl) selEl.textContent = '已选 ' + count + ' / ' + allWords.length + ' 个单词';
            const startBtn = document.getElementById('btnStartDict');
            if (startBtn) {
              if (count === 0) {
                startBtn.textContent = '请先选择单词';
                startBtn.disabled = true;
              } else {
                startBtn.textContent = '开始听写 (' + count + ' 个单词)';
                startBtn.disabled = false;
              }
            }
          };

          // 单元折叠
          document.querySelectorAll('.dict-select-unit-header').forEach(hdr => {
            hdr.addEventListener('click', function(e) {
              if (e.target.closest('input')) return;
              const ui = this.dataset.dsu;
              const body2 = document.querySelector('[data-dsw="' + ui + '"]');
              const arrow2 = this.querySelector('.arrow');
              if (body2.classList.contains('open')) {
                body2.classList.remove('open'); arrow2.classList.remove('open');
              } else {
                body2.classList.add('open'); arrow2.classList.add('open');
              }
            });
          });

          // 单元全选
          document.querySelectorAll('.dict-unit-check').forEach(cb => {
            cb.addEventListener('change', function() {
              const ui = this.dataset.dsu;
              document.querySelectorAll('.dict-word-check[data-unit="' + ui + '"]').forEach(wc => {
                wc.checked = this.checked;
              });
              updateSelectCount();
            });
          });

          // 单词勾选
          document.querySelectorAll('.dict-word-check').forEach(cb => {
            cb.addEventListener('change', function() {
              const ui = this.dataset.unit;
              const allInUnit = document.querySelectorAll('.dict-word-check[data-unit="' + ui + '"]');
              const allChecked = Array.from(allInUnit).every(c => c.checked);
              const unitCb = document.querySelector('.dict-unit-check[data-dsu="' + ui + '"]');
              if (unitCb) unitCb.checked = allChecked;
              updateSelectCount();
            });
          });

          // 开始听写
          document.getElementById('btnStartDict').addEventListener('click', () => {
            const checked = document.querySelectorAll('.dict-word-check:checked');
            if (checked.length === 0) { UI.toast('请至少选择一个单词'); return; }
            selectedWords = [];
            checked.forEach(cb => {
              const w = allWords.find(x => x.en === cb.dataset.en);
              if (w) selectedWords.push(w);
            });
            // 随机打乱顺序
            for (let i = selectedWords.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [selectedWords[i], selectedWords[j]] = [selectedWords[j], selectedWords[i]];
            }
            dictIdx = 0;
            currentInput = '';
            userResults = new Array(selectedWords.length).fill(null);
            dictState = 'playing';
            renderDict();
            setTimeout(() => speakCurrentWord(), 400);
          });

        } else if (dictState === 'playing') {
          const word = selectedWords[dictIdx];
          body = '<div style="text-align:center;margin-bottom:12px">';
          body += '<div style="font-size:13px;color:var(--text-secondary)">第 ' + (dictIdx + 1) + ' / ' + selectedWords.length + ' 个</div>';
          body += '<div style="font-size:14px;color:var(--text-tertiary);margin-top:4px">提示: ' + word.zh + '</div>';
          body += '</div>';

          // 拼写显示区
          body += '<div class="word-display" id="wordDisplay">';
          const wordLen = word.en.length;
          for (let i = 0; i < Math.max(wordLen, currentInput.length, 1); i++) {
            const ch = currentInput[i] || '';
            const empty = i >= currentInput.length && i < wordLen;
            body += '<div class="word-display-char' + (empty ? ' empty' : '') + '">' + (ch || (empty ? '_' : '')) + '</div>';
          }
          body += '</div>';

          // 再听按钮
          body += '<div style="text-align:center;margin:8px 0">';
          body += '<button class="mode-btn secondary" id="btnReplayWord" style="font-size:13px;padding:6px 16px">&#x1F50A; 再听一次</button>';
          body += '</div>';

          // 自定义键盘
          body += renderKeyboardHtml();

          sub.innerHTML = body;

          // 键盘事件
          document.querySelectorAll('.key-letter').forEach(btn => {
            btn.addEventListener('click', function() {
              currentInput += this.dataset.letter;
              renderDict();
              // 自动聚焦确认按钮区域
              setTimeout(() => {
                const kc = document.getElementById('keyConfirm');
                if (kc) kc.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
              }, 50);
            });
          });

          document.getElementById('keyDelete')?.addEventListener('click', () => {
            currentInput = currentInput.slice(0, -1);
            renderDict();
          });

          document.getElementById('keyConfirm')?.addEventListener('click', () => {
            if (!currentInput.trim()) return;
            const correct = currentInput.toLowerCase().trim() === word.en.toLowerCase().trim();
            userResults[dictIdx] = { word, answer: currentInput, correct };
            dictState = 'feedback';
            renderDict();
          });

          document.getElementById('btnReplayWord')?.addEventListener('click', () => {
            AudioEngine.speakWord(word.en);
          });

        } else if (dictState === 'feedback') {
          const result = userResults[dictIdx];
          const word = selectedWords[dictIdx];
          const isLast = dictIdx >= selectedWords.length - 1;

          body = '<div class="word-result-banner ' + (result.correct ? 'correct' : 'wrong') + '">';
          body += '<div class="result-icon">' + (result.correct ? '&#x2714;' : '&#x2718;') + '</div>';
          body += '<div class="result-word">' + word.en + '</div>';
          body += '<div class="result-phonetic">' + word.phonetic + '</div>';
          body += '<div class="result-zh">' + word.zh + '</div>';
          if (!result.correct) {
            body += '<div class="result-user-input" style="background:var(--red-bg);color:var(--red)">你的输入: <strong>' + result.answer + '</strong></div>';
          }
          body += '</div>';

          body += '<div style="display:flex;gap:8px;margin-top:12px">';
          body += '<button class="mode-btn primary" id="btnRetryWord" style="flex:1">重新听写</button>';
          body += '<button class="mode-btn secondary" id="btnNextWord" style="flex:1">' + (isLast ? '完成' : '下一个') + '</button>';
          body += '</div>';

          sub.innerHTML = body;

          document.getElementById('btnRetryWord')?.addEventListener('click', () => {
            currentInput = '';
            userResults[dictIdx] = null;
            dictState = 'playing';
            renderDict();
            setTimeout(() => speakCurrentWord(), 300);
          });

          document.getElementById('btnNextWord')?.addEventListener('click', () => {
            if (isLast) {
              dictState = 'finished';
              renderDict();
            } else {
              dictIdx++;
              currentInput = '';
              dictState = 'playing';
              renderDict();
              setTimeout(() => speakCurrentWord(), 300);
            }
          });

        } else if (dictState === 'finished') {
          const correctCount = userResults.filter(r => r && r.correct).length;
          body = '<div class="dictation-status">';
          body += '<div class="current-word">听写完成!</div>';
          body += '<div style="font-size:48px;font-weight:800;color:var(--tint);line-height:1;margin:8px 0">' + correctCount + ' / ' + selectedWords.length + '</div>';
          body += '<div style="font-size:14px;color:var(--text-secondary);margin-bottom:16px">正确率: ' + Math.round(correctCount / Math.max(1, selectedWords.length) * 100) + '%</div>';
          body += '<button class="mode-btn primary" id="btnRestartDict" style="width:100%;margin-bottom:8px">重新听写</button>';
          body += '<button class="mode-btn secondary" id="btnShowDictAnswers" style="width:100%">查看答案对照</button>';
          body += '<div id="dictAnswers" style="margin-top:16px;text-align:left"></div>';
          body += '</div>';

          sub.innerHTML = body;

          document.getElementById('btnRestartDict')?.addEventListener('click', () => {
            dictIdx = 0;
            currentInput = '';
            userResults = new Array(selectedWords.length).fill(null);
            dictState = 'select';
            renderDict();
          });

          document.getElementById('btnShowDictAnswers')?.addEventListener('click', () => {
            let ansHtml = '<div class="section-title">答案对照</div><div class="word-list">';
            selectedWords.forEach((w, i) => {
              const r = userResults[i];
              const isCorrect = r && r.correct;
              const userAns = r ? r.answer : '(未作答)';
              ansHtml += '<div class="word-item" style="border-color:' + (isCorrect ? 'var(--green)' : 'var(--red)') + '">';
              ansHtml += '<div style="flex:1">';
              ansHtml += '<div style="display:flex;align-items:center;gap:8px">';
              ansHtml += '<span class="word-en" style="color:' + (isCorrect ? 'var(--green)' : 'var(--red)') + '">' + w.en + '</span>';
              ansHtml += '<span class="word-phonetic">' + w.phonetic + '</span></div>';
              ansHtml += '<div class="word-zh">' + w.zh + '</div>';
              ansHtml += '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px">你的输入: <span style="color:' + (isCorrect ? 'var(--green)' : 'var(--red)') + ';font-weight:600">' + userAns + '</span> ' + (isCorrect ? '(正确)' : '(错误)') + '</div>';
              ansHtml += '</div></div>';
            });
            ansHtml += '</div>';
            document.getElementById('dictAnswers').innerHTML = ansHtml;
          });
        }
      };

      renderDict();
    };

    // ========== 背单词模式 (语音背诵 + 逐词反馈) ==========
    const showWordRecite = () => {
      document.getElementById('btnWordList').className = 'mode-btn secondary';
      document.getElementById('btnDictation').className = 'mode-btn secondary';
      document.getElementById('btnWordRecite').className = 'mode-btn primary';
      document.getElementById('btnWordGame').className = 'mode-btn secondary';
      document.getElementById('btnWordBook').className = 'mode-btn secondary';

      let selectedWords = getSelectedWords();
      if (selectedWords.length === 0) { selectedWords = allWords.slice(0, 10); }

      let reciteIdx = 0;
      let reciteState = 'select'; // 'select' | 'speaking' | 'feedback' | 'finished'
      let isListening = false;
      let lastRecognized = '';
      let reciteResults = [];

      const renderRecite = () => {
        const sub = document.getElementById('wordSubContent');
        let body = '';

        if (reciteState === 'select') {
          body = '<div class="section-title">选择要背诵的单词</div>';

            body += '<div class="dict-select-unit">';
            body += '<div class="dict-select-unit-header" data-dsu2="' + ui + '">';
            body += '<input type="checkbox" class="word-checkbox dict-unit-check2" data-dsu2="' + ui + '" style="width:18px;height:18px">';
            body += '<span>' + unit.name + '</span>';
            body += '<span style="font-size:12px;color:var(--text-tertiary)">' + unit.words.length + '词</span>';
            body += '<span class="arrow">&#9654;</span>';
            body += '</div>';
            body += '<div class="dict-select-words" data-dsw2="' + ui + '">';
            unit.words.forEach(w => {
              body += '<div class="dict-select-word-item">';
              body += '<input type="checkbox" class="word-checkbox recite-word-check" data-en="' + w.en + '" data-unit="' + ui + '" style="width:18px;height:18px">';
              body += '<span style="flex:1">' + w.en + '</span>';
              body += '<span style="font-size:12px;color:var(--text-tertiary)">' + w.zh + '</span>';
              body += '</div>';
            });
            body += '</div></div>';
          });
          body += '<div class="dict-selected-count" id="reciteSelCount">已选 0 / ' + allWords.length + ' 个单词</div>';
          body += '<button class="mode-btn primary" id="btnStartRecite" style="width:100%;padding:14px" disabled>请先选择单词</button>';
          sub.innerHTML = body;

          document.querySelectorAll('.dict-select-unit-header').forEach(hdr => {
            hdr.addEventListener('click', function(e) {
              if (e.target.closest('input')) return;

          document.querySelectorAll('.dict-unit-check2').forEach(cb => {
            cb.addEventListener('change', function() {
              const ui = this.dataset.dsu2;
              document.querySelectorAll('.recite-word-check[data-unit="' + ui + '"]').forEach(wc => { wc.checked = this.checked; });
              updateReciteCount();
            });

          document.querySelectorAll('.recite-word-check').forEach(cb => {
            cb.addEventListener('change', function() { updateReciteCount(); });
          });

          const updateReciteCount = () => {
            let count = 0;
            document.querySelectorAll('.recite-word-check:checked').forEach(() => count++);
            const selEl = document.getElementById('reciteSelCount');
            if (selEl) selEl.textContent = '已选 ' + count + ' / ' + allWords.length + ' 个单词';
            const startBtn = document.getElementById('btnStartRecite');
            if (startBtn) {
              if (count === 0) { startBtn.textContent = '请先选择单词'; startBtn.disabled = true; }
              else { startBtn.textContent = '开始背诵 (' + count + ' 个单词)'; startBtn.disabled = false; }
            }
          };

          document.getElementById('btnStartRecite')?.addEventListener('click', () => {
            const checked = document.querySelectorAll('.recite-word-check:checked');
            if (checked.length === 0) { UI.toast('请至少选择一个单词'); return; }
            selectedWords = [];
            checked.forEach(cb => {
              const w = allWords.find(x => x.en === cb.dataset.en);
              if (w) selectedWords.push(w);
            });
            // 随机打乱顺序
            for (let i = selectedWords.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [selectedWords[i], selectedWords[j]] = [selectedWords[j], selectedWords[i]];
            }
            reciteIdx = 0;
            reciteResults = new Array(selectedWords.length).fill(null);
            reciteState = 'speaking';
            renderRecite();
          });

        } else if (reciteState === 'speaking') {
          const word = selectedWords[reciteIdx];
          body = '<div style="text-align:center;margin-bottom:12px">';
          body += '<div style="font-size:13px;color:var(--text-secondary)">第 ' + (reciteIdx + 1) + ' / ' + selectedWords.length + ' 个</div>';
          body += '</div>';
          body += '<div class="recite-word-display">';
          body += '<div class="recite-zh">' + word.zh + '</div>';
          body += '<div class="recite-hint">请说出对应的英文单词</div>';
          body += '</div>';

          body += '<button class="recite-mic-btn' + (isListening ? ' listening' : '') + '" id="btnReciteMic">';
          body += '<svg width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>';
          body += '</button>';

          body += '<div style="text-align:center;font-size:14px;color:var(--text-secondary);margin-top:8px">'
            + (isListening ? '正在听你朗读...' : '点击麦克风开始背诵')
            + '</div>';

          if (lastRecognized) {
            body += '<div style="text-align:center;margin-top:8px;font-size:16px;padding:8px;background:var(--bg-secondary);border-radius:8px">';
            body += '听到: <strong>' + lastRecognized + '</strong>';
            body += '</div>';
          }

          body += '<div style="display:flex;gap:8px;margin-top:16px">';
          body += '<button class="mode-btn secondary" id="btnReplayReciteWord" style="flex:1">听正确发音</button>';
          body += '<button class="mode-btn secondary" id="btnSkipRecite" style="flex:1">跳过</button>';
          body += '</div>';

          sub.innerHTML = body;

          document.getElementById('btnReciteMic')?.addEventListener('click', () => {
            if (isListening) {
              SpeechEngine.stop();
              return;
            }
            if (!SpeechEngine.isSupported) {
              UI.toast('语音识别不可用，请使用 Chrome 浏览器');
              return;
            }
            isListening = true;
            lastRecognized = '';
            renderRecite();

            SpeechEngine.start(
              (transcript) => {
                lastRecognized = transcript;
                isListening = false;
                const scores = scorePronunciation(word.en, transcript);
                const isCorrect = transcript.toLowerCase().trim() === word.en.toLowerCase().trim();
                reciteResults[reciteIdx] = { word, recognized: transcript, correct: isCorrect, scores };
                reciteState = 'feedback';
                renderRecite();
              },
              (error) => {
                isListening = false;
                UI.toast('识别失败: ' + error + '，请重试');
                renderRecite();
              },
              () => {
                isListening = false;
                renderRecite();
              }
            );
          });

          document.getElementById('btnReplayReciteWord')?.addEventListener('click', () => {
            AudioEngine.speakWord(word.en);
          });

          document.getElementById('btnSkipRecite')?.addEventListener('click', () => {
            SpeechEngine.stop();
            isListening = false;
            reciteResults[reciteIdx] = { word, recognized: '', correct: false, scores: { accuracy: 0, fluency: 0, completeness: 0, overall: 0 } };
            reciteState = 'feedback';
            renderRecite();
          });

        } else if (reciteState === 'feedback') {
          const result = reciteResults[reciteIdx];
          const word = selectedWords[reciteIdx];
          const isLast = reciteIdx >= selectedWords.length - 1;

          const s = result.scores || { accuracy: 0, fluency: 0, completeness: 0, overall: 0 };
          body = '<div class="word-result-banner ' + (result.correct ? 'correct' : 'wrong') + '">';
          body += '<div class="result-icon">' + (result.correct ? '&#x2714;' : '&#x2718;') + '</div>';
          body += '<div class="result-word">' + word.en + '</div>';
          body += '<div class="result-phonetic">' + word.phonetic + '</div>';
          body += '<div class="result-zh">' + word.zh + '</div>';
          if (!result.correct && result.recognized) {
            body += '<div class="result-user-input" style="background:var(--red-bg);color:var(--red)">你的发音: <strong>' + result.recognized + '</strong></div>';
          }
          if (!result.correct && !result.recognized) {
            body += '<div style="margin-top:8px;font-size:14px;color:var(--text-secondary)">未识别到发音</div>';
          }
          body += '<div class="score-grid" style="margin-top:12px">';
          body += '<div class="score-item"><div class="score-value" style="color:' + (s.accuracy >= 80 ? 'var(--green)' : s.accuracy >= 50 ? 'var(--orange)' : 'var(--red)') + '">' + s.accuracy + '%</div><div class="score-label">准确度</div></div>';
          body += '<div class="score-item"><div class="score-value" style="color:var(--tint)">' + s.fluency + '%</div><div class="score-label">流利度</div></div>';
          body += '<div class="score-item"><div class="score-value" style="color:' + (s.completeness >= 80 ? 'var(--green)' : 'var(--orange)') + '">' + s.completeness + '%</div><div class="score-label">完整度</div></div>';
          body += '</div>';
          body += '<div class="score-overall"><div class="big-score">' + s.overall + '</div><div class="big-label">总分 / 100</div></div>';
          body += '</div>';

          body += '<div style="display:flex;gap:8px;margin-top:12px">';
          body += '<button class="mode-btn secondary" id="btnListenRecite" style="flex:1">听正确发音</button>';
          body += '<button class="mode-btn primary" id="btnRetryRecite" style="flex:1">重新背诵</button>';
          body += '<button class="mode-btn secondary" id="btnNextRecite" style="flex:1">' + (isLast ? '完成' : '下一个') + '</button>';
          body += '</div>';

          sub.innerHTML = body;

          document.getElementById('btnListenRecite')?.addEventListener('click', () => {
            AudioEngine.speakWord(word.en);
          });

          document.getElementById('btnRetryRecite')?.addEventListener('click', () => {
            lastRecognized = '';
            reciteResults[reciteIdx] = null;
            reciteState = 'speaking';
            renderRecite();
          });

          document.getElementById('btnNextRecite')?.addEventListener('click', () => {
            if (isLast) {
              reciteState = 'finished';
              renderRecite();
            } else {
              reciteIdx++;
              lastRecognized = '';
              reciteState = 'speaking';
              renderRecite();
            }
          });

        } else if (reciteState === 'finished') {
          const correctCount = reciteResults.filter(r => r && r.correct).length;
          body = '<div class="dictation-status">';
          body += '<div class="current-word">背诵完成!</div>';
          body += '<div style="font-size:48px;font-weight:800;color:var(--tint);line-height:1;margin:8px 0">' + correctCount + ' / ' + selectedWords.length + '</div>';
          body += '<div style="font-size:14px;color:var(--text-secondary);margin-bottom:16px">正确率: ' + Math.round(correctCount / Math.max(1, selectedWords.length) * 100) + '%</div>';
          body += '<button class="mode-btn primary" id="btnRestartRecite" style="width:100%;margin-bottom:8px">重新背诵</button>';
          body += '<button class="mode-btn secondary" id="btnShowReciteAnswers" style="width:100%">查看详情</button>';
          body += '<div id="reciteAnswers" style="margin-top:16px;text-align:left"></div>';
          body += '</div>';

          sub.innerHTML = body;

          document.getElementById('btnRestartRecite')?.addEventListener('click', () => {
            reciteIdx = 0;
            lastRecognized = '';
            reciteResults = new Array(selectedWords.length).fill(null);
            reciteState = 'select';
            renderRecite();
          });

          document.getElementById('btnShowReciteAnswers')?.addEventListener('click', () => {
            let ansHtml = '<div class="section-title">背诵详情</div><div class="word-list">';
            selectedWords.forEach((w, i) => {
              const r = reciteResults[i];
              const isCorrect = r && r.correct;
              const recognized = r ? r.recognized : '(未识别)';
              ansHtml += '<div class="word-item" style="border-color:' + (isCorrect ? 'var(--green)' : 'var(--red)') + '">';
              ansHtml += '<div style="flex:1">';
              ansHtml += '<div style="display:flex;align-items:center;gap:8px">';
              ansHtml += '<span class="word-en" style="color:' + (isCorrect ? 'var(--green)' : 'var(--red)') + '">' + w.en + '</span>';
              ansHtml += '<span class="word-phonetic">' + w.phonetic + '</span></div>';
              ansHtml += '<div class="word-zh">' + w.zh + '</div>';
              ansHtml += '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px">你的发音: <span style="color:' + (isCorrect ? 'var(--green)' : 'var(--red)') + ';font-weight:600">' + recognized + '</span> ' + (isCorrect ? '(正确)' : '(错误)') + '</div>';
              ansHtml += '</div></div>';
            });
            ansHtml += '</div>';
            document.getElementById('reciteAnswers').innerHTML = ansHtml;
          });
        }
      };

      renderRecite();
    };

    // ========== 单词闯关 ==========
    const showWordGame = () => {
      document.getElementById('btnWordList').className = 'mode-btn secondary';
      document.getElementById('btnDictation').className = 'mode-btn secondary';
      document.getElementById('btnWordRecite').className = 'mode-btn secondary';
      document.getElementById('btnWordGame').className = 'mode-btn primary';
      document.getElementById('btnWordBook').className = 'mode-btn secondary';

      let gameWords = [], gameIdx = 0, score = 0, combo = 0, timer = null, timeLeft = 5, gameState = 'select';

      const renderGame = () => {
        const sub = document.getElementById('wordSubContent');
        if (gameState === 'select') {
          let b = '<div class="section-title">单词闯关 — 选择单元</div>';
          book.units.forEach((unit, ui) => {
            b += '<div class="dict-select-unit"><div class="dict-select-unit-header" data-gsu="' + ui + '"><span>' + unit.name + '</span><span style="font-size:12px;color:var(--text-tertiary);margin-left:auto">' + unit.words.length + '词</span></div></div>';
          });
          b += '<button class="mode-btn primary" id="btnStartGameAll" style="width:100%;padding:14px;margin-top:12px">全部单词挑战 (' + allWords.length + '词)</button>';
          sub.innerHTML = b;
          document.querySelectorAll('.dict-select-unit-header').forEach(hdr => hdr.addEventListener('click', function() { startGameRound(book.units[parseInt(this.dataset.gsu)].words); }));
          document.getElementById('btnStartGameAll')?.addEventListener('click', () => startGameRound(allWords));
        } else if (gameState === 'playing') {
          const word = gameWords[gameIdx];
          let opts = gameWords.filter(w => w.en !== word.en).sort(() => Math.random() - 0.5).slice(0, 3).map(w => w.en);
          while (opts.length < 3) opts.push(opts.length < 2 ? 'hello' : 'book');
          opts = [word.en, ...opts].sort(() => Math.random() - 0.5);
          sub.innerHTML = '<div style="text-align:center;margin-bottom:12px"><div style="font-size:13px;color:var(--text-secondary)">第 ' + (gameIdx + 1) + ' / ' + gameWords.length + ' 题</div><div style="font-size:13px;color:var(--text-tertiary)">得分: ' + score + ' | 连击: ' + combo + '</div></div>'
            + '<div style="height:4px;background:var(--bg-tertiary);border-radius:2px;margin-bottom:16px;overflow:hidden"><div id="timerBar" style="height:100%;background:var(--tint);width:100%"></div></div>'
            + '<div style="text-align:center;padding:24px;background:var(--bg-secondary);border-radius:var(--radius-lg);margin-bottom:16px"><div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">选择正确的英文单词</div><div style="font-size:28px;font-weight:700">' + word.zh + '</div></div>'
            + '<div class="quiz-options">' + opts.map(o => '<button class="quiz-option game-opt" data-a="' + (o === word.en ? '1' : '0') + '">' + o + '</button>').join('') + '</div>';
          timeLeft = 5;
          timer = setInterval(() => { timeLeft -= 0.1; const bar = document.getElementById('timerBar'); if (bar) bar.style.width = Math.max(0, (timeLeft / 5) * 100) + '%'; if (timeLeft <= 0) { clearInterval(timer); combo = 0; advanceOrFinish(); } }, 100);
          document.querySelectorAll('.game-opt').forEach(btn => btn.addEventListener('click', function() { clearInterval(timer); if (this.dataset.a === '1') { score += 10 + combo * 2; combo++; this.style.cssText = 'background:var(--green-bg);border-color:var(--green)'; } else { combo = 0; this.style.cssText = 'background:var(--red-bg);border-color:var(--red)'; document.querySelectorAll('.game-opt').forEach(b => { if (b.dataset.a === '1') b.style.cssText = 'background:var(--green-bg);border-color:var(--green)'; }); } setTimeout(() => advanceOrFinish(), 800); }));
        } else if (gameState === 'result') {
          const maxScore = gameWords.length * 10;
          const stars = score >= maxScore * 0.9 ? 3 : score >= maxScore * 0.6 ? 2 : 1;
          sub.innerHTML = '<div class="dictation-status"><div style="font-size:40px;margin:12px 0">' + '★'.repeat(stars) + '☆'.repeat(3 - stars) + '</div><div style="font-size:48px;font-weight:800;color:var(--tint)">' + score + '</div><div style="font-size:14px;color:var(--text-secondary)">总分 (最高 ' + maxScore + ')</div><div style="font-size:14px;color:var(--tint);margin-bottom:16px">最大连击: ' + combo + '</div><button class="mode-btn primary" id="btnReplayGame" style="width:100%;margin-bottom:8px">再来一局</button><button class="mode-btn secondary" id="btnBackGame" style="width:100%">返回选择</button></div>';
          document.getElementById('btnReplayGame')?.addEventListener('click', () => startGameRound(gameWords));
          document.getElementById('btnBackGame')?.addEventListener('click', () => { gameState = 'select'; renderGame(); });
        }
      };
      const advanceOrFinish = () => { gameIdx++; if (gameIdx >= gameWords.length) { gameState = 'result'; } renderGame(); };
      const startGameRound = (words) => { if (words.length < 4) { UI.toast('至少需要4个单词'); return; } gameWords = [...words].sort(() => Math.random() - 0.5).slice(0, Math.min(10, words.length)); gameIdx = 0; score = 0; combo = 0; gameState = 'playing'; renderGame(); };
      renderGame();
    };

    // ========== 生词本 ==========
    const showWordBook = () => {
      document.getElementById('btnWordList').className = 'mode-btn secondary';
      document.getElementById('btnDictation').className = 'mode-btn secondary';
      document.getElementById('btnWordRecite').className = 'mode-btn secondary';
      document.getElementById('btnWordGame').className = 'mode-btn secondary';
      document.getElementById('btnWordBook').className = 'mode-btn primary';
      const wb = Store.getWordBook();
      document.getElementById('wordSubContent').innerHTML = '<div class="section-title">生词本 (' + wb.length + ' 个单词)</div>'
        + (wb.length === 0 ? '<div class="empty-state"><div class="empty-text">还没有收藏单词，去单词列表添加吧</div></div>'
        : '<div class="word-list">' + wb.map(w => '<div class="word-item" data-en="' + w.en + '">'
          + '<div class="word-play" data-word="' + w.en + '">'
          + '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg></div>'
          + '<div><div class="word-en">' + w.en + '</div>'
          + '<div class="word-phonetic">' + w.phonetic + '</div></div>'
          + '<div class="word-zh">' + w.zh + '</div>'
          + '<button class="mode-btn secondary" style="font-size:11px;padding:4px 8px" data-remove="' + w.en + '">移除</button>'
          + '</div>').join('') + '</div>');

      document.querySelectorAll('.word-play').forEach(btn => {
        btn.addEventListener('click', function(e) { e.stopPropagation(); AudioEngine.speakWord(this.dataset.word); });
      });
      document.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          Store.removeFromWordBook(this.dataset.remove);
          showWordBook();
        });
      });
    };

    // 事件绑定
    document.getElementById('btnWordList').addEventListener('click', showWordList);
    document.getElementById('btnDictation').addEventListener('click', showDictation);
    document.getElementById('btnWordRecite').addEventListener('click', showWordRecite);
    document.getElementById('btnWordGame').addEventListener('click', showWordGame);
    document.getElementById('btnWordBook').addEventListener('click', showWordBook);

    showWordList();
  },

  /* ============================================================
  /* ============================================================
     语法页
     ============================================================ */
  renderGrammarContent() {
    const grammarGrades = {
      '三年级': [
        { title: 'Be 动词 (am/is/are)', rule: 'I 用 am，he/she/it 用 is，you/we/they 用 are。', example: 'I <strong>am</strong> a student.', quiz: { q: 'He ___ a teacher.', options: ['am', 'is', 'are'], answer: 1 } },
        { title: '冠词 a/an', rule: 'a 用于辅音音素前，an 用于元音音素前。', example: '<strong>a</strong> book / <strong>an</strong> apple', quiz: { q: '___ elephant.', options: ['A', 'An', 'The'], answer: 1 } },
        { title: '物主代词', rule: 'my, your, his, her, its, our, their', example: 'This is <strong>my</strong> book.', quiz: { q: 'This is ___ pen. (她的)', options: ['his', 'her', 'my'], answer: 1 } },
        { title: 'What 疑问句', rule: 'What 用于询问事物。', example: '<strong>What</strong> is this?', quiz: { q: '___ is your name?', options: ['What', 'How', 'Who'], answer: 0 } },
        { title: 'How many 疑问句', rule: 'How many + 可数名词复数?', example: '<strong>How many</strong> books?', quiz: { q: '___ pencils?', options: ['How old', 'How many', 'What'], answer: 1 } },
        { title: '祈使句', rule: '动词原形开头，否定用 Don\'t。', example: '<strong>Look</strong> at me!', quiz: { q: '___ at the blackboard.', options: ['Looks', 'Look', 'Looking'], answer: 1 } },
        { title: 'This/That 指示代词', rule: 'This 近，That 远。', example: '<strong>That</strong> is your desk.', quiz: { q: '___ is a bird over there.', options: ['This', 'That', 'These'], answer: 1 } },
        { title: 'have/has', rule: 'I/You/We/They→have，He/She/It→has。', example: 'She <strong>has</strong> a cat.', quiz: { q: 'She ___ brothers.', options: ['have', 'has', 'is'], answer: 1 } }
      ],
      '四年级': [
        { title: 'There be 句型', rule: 'There is + 单数，There are + 复数。', example: '<strong>There is</strong> a book.', quiz: { q: 'There ___ milk.', options: ['is', 'are', 'am'], answer: 0 } },
        { title: 'some / any', rule: 'some→肯定句，any→否定/疑问句。', example: 'Do you have <strong>any</strong> water?', quiz: { q: 'Do you have ___ water?', options: ['some', 'any', 'a'], answer: 1 } },
        { title: 'Can 情态动词', rule: 'Can + 动词原形，表能力/请求。', example: 'I <strong>can</strong> swim.', quiz: { q: '___ you play?', options: ['Are', 'Can', 'Do'], answer: 1 } },
        { title: '现在进行时', rule: 'am/is/are + 动词-ing。', example: 'She <strong>is reading</strong>.', quiz: { q: 'She ___ now.', options: ['reads', 'is reading', 'read'], answer: 1 } },
        { title: '人称代词格', rule: '主格(I/he)作主语，宾格(me/him)作宾语。', example: '<strong>I</strong> like <strong>him</strong>.', quiz: { q: 'Help ___.', options: ['I', 'me', 'my'], answer: 1 } },
        { title: 'How old 问年龄', rule: 'How old + be + 主语?', example: '<strong>How old</strong> are you?', quiz: { q: 'How old ___ she?', options: ['is', 'are', 'am'], answer: 0 } },
        { title: 'What colour', rule: 'What colour is/are + 主语?', example: '<strong>What colour</strong> is it?', quiz: { q: 'What colour ___ the flowers?', options: ['is', 'are', 'am'], answer: 1 } }
      ],
      '五年级': [
        { title: '一般现在时(三单)', rule: '第三人称单数动词加 -s/-es。', example: 'He <strong>likes</strong> apples.', quiz: { q: 'Tom ___ football.', options: ['play', 'plays', 'playing'], answer: 1 } },
        { title: '一般将来时 will', rule: 'will + 动词原形。否定 won\'t。', example: 'I <strong>will go</strong>.', quiz: { q: 'She ___ come.', options: ['will', 'is', 'was'], answer: 0 } },
        { title: 'be going to', rule: 'am/is/are going to + 动词原形。', example: 'I <strong>am going to</strong> visit.', quiz: { q: 'They ___ play.', options: ['is going to', 'are going to', 'going to'], answer: 1 } },
        { title: '比较级', rule: '短词+-er，长词 more + 原级。', example: 'He is <strong>taller</strong>.', quiz: { q: 'This is ___ than that.', options: ['interesting', 'more interesting', 'most interesting'], answer: 1 } },
        { title: '最高级', rule: '短词+-est，长词 most + 原级。', example: 'the <strong>tallest</strong>.', quiz: { q: 'She is the ___.', options: ['pretty', 'prettier', 'prettiest'], answer: 2 } },
        { title: '频度副词', rule: 'always>usually>often>sometimes>never', example: 'I <strong>always</strong> get up early.', quiz: { q: 'I ___ eat. (100%)', options: ['sometimes', 'never', 'always'], answer: 2 } },
        { title: 'Wh- 疑问词', rule: 'What/Where/When/Who/Why/How', example: '<strong>Where</strong> do you live?', quiz: { q: '___ do you go?', options: ['What', 'How', 'Where'], answer: 1 } }
      ],
      '六年级': [
        { title: '一般过去式(规则)', rule: '动词+-ed 表过去。', example: 'I <strong>played</strong>.', quiz: { q: 'She ___ TV.', options: ['watch', 'watches', 'watched'], answer: 2 } },
        { title: '过去式(不规则)', rule: 'go→went, see→saw, eat→ate', example: 'I <strong>went</strong> to the park.', quiz: { q: 'They ___ to the zoo.', options: ['go', 'went', 'goed'], answer: 1 } },
        { title: '过去式否定/疑问', rule: 'didn\'t+原形 / Did+主语+原形?', example: 'I <strong>didn\'t go</strong>.', quiz: { q: '___ you do it?', options: ['Do', 'Did', 'Are'], answer: 1 } },
        { title: '形容词→副词', rule: '形容词+ly→副词，修饰动词。', example: 'She runs <strong>quickly</strong>.', quiz: { q: 'He speaks ___.', options: ['good', 'well', 'nice'], answer: 1 } },
        { title: '介词 at/in/on(时间)', rule: 'at 时刻, in 月季年, on 日期', example: '<strong>at</strong> 7:00, <strong>in</strong> July', quiz: { q: 'I get up ___ 6:30.', options: ['at', 'in', 'on'], answer: 0 } },
        { title: '介词 at/in/on(地点)', rule: 'at 小地点, in 大范围, on 表面', example: '<strong>at</strong> home, <strong>in</strong> China', quiz: { q: 'The book is ___ the table.', options: ['at', 'in', 'on'], answer: 2 } },
        { title: 'too/either/also', rule: 'too 肯定句末, either 否定句末', example: 'I like it <strong>too</strong>.', quiz: { q: 'I don\'t know ___.', options: ['too', 'either', 'also'], answer: 1 } },
        { title: 'both / all', rule: 'both 两者都, all 三+都', example: '<strong>Both</strong> are students.', quiz: { q: '___ parents are teachers.', options: ['All', 'Both', 'Every'], answer: 1 } }
      ]
    };

    // 扁平化索引用于 quizState
    const allGrammar = [];
    for (const grade of Object.keys(grammarGrades)) {
      grammarGrades[grade].forEach(g => allGrammar.push(g));
    }

    let quizState = {};

    // 一次性创建 tab 结构
    document.getElementById('grammarContent').innerHTML = '<div style="display:flex;gap:8px;margin-bottom:16px"><button class="mode-btn primary" id="btnGrammarTab" style="flex:1">语法</button><button class="mode-btn secondary" id="btnPhonicsTab" style="flex:1">自然拼读</button></div><div id="grammarSubContent"></div>';

    const renderGrammarList = () => {
      document.getElementById('btnGrammarTab').className = 'mode-btn primary';
      document.getElementById('btnPhonicsTab').className = 'mode-btn secondary';
      const sub = document.getElementById('grammarSubContent');
      let html2 = '<div class="grammar-card" style="background:var(--tint-bg);border-color:var(--tint);margin-bottom:20px"><h3 style="text-align:center">每日语法知识点</h3><div style="text-align:center;font-size:14px;color:var(--text-secondary)">今日推荐: ' + allGrammar[new Date().getDate() % allGrammar.length].title + '</div></div>';

      const gradeNames = ['三年级', '四年级', '五年级', '六年级'];
      gradeNames.forEach((grade, gi) => {
        const items = grammarGrades[grade];
        html2 += '<div class="unit-word-group"><div class="unit-word-header" data-grammar-grade="' + gi + '"><span class="collapse-arrow">&#9654;</span><span class="unit-name">' + grade + '</span><span class="unit-count">' + items.length + ' 个知识点</span></div>';
        html2 += '<div class="unit-word-body" data-grammar-body="' + gi + '">';
        items.forEach((gp, i2) => {
          const globalIdx = allGrammar.indexOf(gp);
          html2 += '<div class="grammar-card"><h3>' + gp.title + '</h3><div class="grammar-rule">' + gp.rule + '</div><div class="grammar-example">' + gp.example + '</div>';
          if (gp.quiz) {
            html2 += '<div style="margin-top:12px"><div class="quiz-question">' + gp.quiz.q + '</div><div class="quiz-options">';
            gp.quiz.options.forEach((opt, oi) => {
              let cls = 'quiz-option';
              if (quizState[globalIdx] !== undefined) {
                if (oi === gp.quiz.answer) cls += ' correct';
                else if (oi === quizState[globalIdx]) cls += ' wrong';
              }
              html2 += '<button class="' + cls + '" data-grammar="' + globalIdx + '" data-option="' + oi + '" ' + (quizState[globalIdx] !== undefined ? 'disabled' : '') + '>' + opt + '</button>';
            });
            html2 += '</div>';
            if (quizState[globalIdx] !== undefined) {
              html2 += '<div style="margin-top:8px;font-size:13px;color:' + (quizState[globalIdx] === gp.quiz.answer ? 'var(--green)' : 'var(--red)') + '">' + (quizState[globalIdx] === gp.quiz.answer ? '回答正确!' : '回答错误，正确答案是: ' + gp.quiz.options[gp.quiz.answer]) + '</div>';
            }
            html2 += '</div>';
          }
          html2 += '</div>';
        });
        html2 += '</div></div>';
      });

      sub.innerHTML = html2;

      // 折叠/展开
      document.querySelectorAll('[data-grammar-grade]').forEach(hdr => {
        hdr.addEventListener('click', function() {
          const gi2 = this.dataset.grammarGrade;
          const arrow = this.querySelector('.collapse-arrow');
          const body = document.querySelector('[data-grammar-body="' + gi2 + '"]');
          if (body.classList.contains('open')) { arrow.classList.remove('open'); body.classList.remove('open'); }
          else { arrow.classList.add('open'); body.classList.add('open'); }
        });
      });

      // Quiz 事件
      document.querySelectorAll('.quiz-option').forEach(btn => {
        btn.addEventListener('click', () => {
          quizState[parseInt(btn.dataset.grammar)] = parseInt(btn.dataset.option);
          renderGrammarList();
        });
      });
    };

    document.getElementById('btnGrammarTab').addEventListener('click', () => { quizState = {}; renderGrammarList(); });
    document.getElementById('btnPhonicsTab').addEventListener('click', () => { AudioEngine.stop(); renderPhonics(); });
    renderGrammarList();
  },

  /* ============================================================
     我的页
     ============================================================ */
  renderMeContent() {
    const stats = Store.getStats();
    const streak = Store.getCheckInStreak();
    const hours = Math.floor(stats.totalTime / 3600);
    const minutes = Math.floor((stats.totalTime % 3600) / 60);

    document.getElementById('meContent').innerHTML = `
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-num">${streak}</div>
          <div class="stat-label">连续打卡 (天)</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${hours}h${minutes}m</div>
          <div class="stat-label">学习时长</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${stats.scoreHistory.length}</div>
          <div class="stat-label">跟读次数</div>
        </div>
      </div>

      <button class="mode-btn primary" id="btnCheckIn" style="width:100%;margin-bottom:24px;padding:14px">
        ${Store.getStats().lastStudyDate === new Date().toISOString().slice(0,10) ? '今日已打卡' : '今日打卡签到'}
      </button>

      <div class="section-title">跟读评分历史</div>
      ${stats.scoreHistory.length === 0 ? '<div class="empty-state"><div class="empty-text">还没有跟读记录，去课文页试试吧</div></div>' : `
        <div class="record-list">
          ${stats.scoreHistory.slice(-20).reverse().map(r => `
            <div class="record-item">
              <div>
                <div style="font-size:14px;color:var(--text-primary);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.text}</div>
                <div class="record-date">${new Date(r.date).toLocaleDateString('zh-CN')}</div>
              </div>
              <div class="record-score">${r.score}分</div>
            </div>
          `).join('')}
        </div>
      `}


      <div class="section-title">功能状态</div>
      <div style="padding:12px 14px;background:var(--bg-elevated);border-radius:12px;border:0.5px solid var(--separator);font-size:13px;margin-bottom:12px">
        <div style="font-weight:600;margin-bottom:6px">当前环境</div>
        <div style="display:flex;flex-direction:column;gap:4px;color:var(--text-secondary)">
          <div>TTS 朗读: <span id="ttsStatus" style="color:var(--orange)">检测中...</span></div>
          <div>语音识别: ${SpeechEngine.isSupported ? '<span style="color:var(--green)">可用</span>' : '<span style="color:var(--red)">浏览器不支持</span>'}</div>
          <div>网络协议: ${location.protocol}${location.protocol === 'https:' ? ' (语音功能可用)' : ''}</div>
        </div>
      </div>

      <div style="padding:12px 14px;background:var(--tint-bg);border-radius:12px;border:0.5px solid var(--tint);font-size:13px;margin-bottom:12px">
        <div style="font-weight:600;margin-bottom:4px">添加到手机主屏幕</div>
        <div style="color:var(--text-secondary);line-height:1.6">
          <strong>iPhone (Safari):</strong> 点底部中间的「分享」按钮 → 「添加到主屏幕」<br>
          <strong>Android (Chrome):</strong> 点右上角「⋮」→ 「添加到主屏幕」
        </div>
      </div>
        <button class="mode-btn secondary" id="btnResetStats" style="text-align:left;padding:14px">重置学习统计</button>
        <button class="mode-btn secondary" id="btnClearWordBook" style="text-align:left;padding:14px">清空生词本</button>
      </div>

      <div style="text-align:center;margin-top:32px;padding:20px;color:var(--text-tertiary);font-size:12px">
        英语朗读 v1.0<br>
        PEP 人教版小学英语<br>
        点读 · 跟读 · 背诵 · 单词
      </div>
    `;

    // 艾宾浩斯记忆
    const todayReviews = Store.getTodayReviews();
    const ebStatus = document.getElementById('ebbinghausStatus');
    if (ebStatus) {
      if (todayReviews.length === 0) {
        ebStatus.innerHTML = '<div style="font-size:14px;color:var(--text-secondary)">暂无待复习单词，去单词页学习新词吧!</div>';
      } else {
        ebStatus.innerHTML = '<div style="font-size:14px;color:var(--tint);font-weight:600;cursor:pointer" id="ebStartReview">今日待复习: <strong>' + todayReviews.length + '</strong> 个单词 — 点击开始</div>';
        document.getElementById('ebStartReview').addEventListener('click', () => {
          let ebIdx = 0, ebListening = false, ebLastRecognized = '';
          const ebReviewEl = document.getElementById('ebbinghausReview');
          const renderEbReview = () => {
            if (ebIdx >= todayReviews.length) {
              ebReviewEl.innerHTML = '<div style="text-align:center;padding:16px"><div style="font-size:24px;font-weight:700;color:var(--green)">复习完成!</div></div>';
              ebStatus.innerHTML = '<div style="font-size:14px;color:var(--text-secondary)">今日复习已完成!</div>';
              return;
            }
            const w = todayReviews[ebIdx];
            ebReviewEl.style.display = 'block';
            ebReviewEl.innerHTML = '<div style="text-align:center;padding:12px"><div style="font-size:13px;color:var(--text-secondary)">第 ' + (ebIdx + 1) + ' / ' + todayReviews.length + ' (阶段' + (w.stage + 1) + ')</div><div style="font-size:24px;font-weight:700;margin:12px 0">' + w.zh + '</div><div style="font-size:13px;color:var(--text-tertiary);margin-bottom:12px">请说出对应的英文</div><button class="recite-mic-btn' + (ebListening ? ' listening' : '') + '" id="ebMicBtn"><svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button><div style="font-size:14px;color:var(--text-secondary);margin-top:8px">' + (ebListening ? '正在听...' : '点击麦克风背诵') + '</div>' + (ebLastRecognized ? '<div style="margin-top:8px;font-size:15px;padding:8px;background:var(--bg-secondary);border-radius:8px">听到: <strong>' + ebLastRecognized + '</strong></div>' : '') + '<div style="display:flex;gap:8px;margin-top:16px"><button class="mode-btn primary" id="ebRemember" style="flex:1">记得</button><button class="mode-btn secondary" id="ebForgot" style="flex:1">忘了</button></div></div>';
            document.getElementById('ebMicBtn').addEventListener('click', () => {
              if (ebListening) { SpeechEngine.stop(); return; }
              ebListening = true; ebLastRecognized = ''; renderEbReview();
              SpeechEngine.start(t => { ebLastRecognized = t; ebListening = false; renderEbReview(); }, () => { ebListening = false; renderEbReview(); }, () => { ebListening = false; });
            });
            document.getElementById('ebRemember').addEventListener('click', () => { Store.reviewEbbinghaus(w.en, true); ebIdx++; ebLastRecognized = ''; renderEbReview(); });
            document.getElementById('ebForgot').addEventListener('click', () => { Store.reviewEbbinghaus(w.en, false); ebIdx++; ebLastRecognized = ''; renderEbReview(); });
          };
          renderEbReview();
        });
      }
    }

    document.getElementById('btnCheckIn')?.addEventListener('click', () => {
      const s = Store.checkInToday();
      this.toast('打卡成功! 连续 ' + s.streak + ' 天');
      this.renderMeContent();
    });

    document.getElementById('btnResetStats')?.addEventListener('click', () => {
      if (confirm('确定要重置所有学习统计吗？此操作不可撤销。')) {
        Store.set('stats', { totalTime: 0, streak: 0, lastStudyDate: '', scoreHistory: [] });
        this.renderMeContent();
        this.toast('统计已重置');
      }
    });

    document.getElementById('btnClearWordBook')?.addEventListener('click', () => {
      if (confirm('确定要清空生词本吗？此操作不可撤销。')) {
        Store.set('wordbook', []);
        this.toast('生词本已清空');
        this.renderMeContent();
      }
    });

    // TTS 功能检测（异步加载 voices）
    this.detectTTS();
  },

  detectTTS() {
    const statusEl = document.getElementById('ttsStatus');
    if (!statusEl) return;

    // 检查 API 对象是否存在
    const hasAPI = typeof window.speechSynthesis !== 'undefined' && window.speechSynthesis;
    if (!hasAPI) {
      statusEl.innerHTML = '<span style="color:var(--red)">不可用（浏览器不支持此 API）</span>';
      return;
    }

    // Android 上 getVoices() 经常返回空数组，但这不代表 TTS 不可用
    // 实际发音时系统会自动使用默认语音引擎
    const voices = window.speechSynthesis.getVoices();
    const enVoices = voices.filter(v => v.lang.startsWith('en'));

    if (enVoices.length > 0) {
      statusEl.innerHTML = `<span style="color:var(--green)">可用 (${enVoices.length} 个英语语音)</span>`;
    } else {
      // voices 为空不等于不可用，Android 会使用系统默认引擎
      statusEl.innerHTML = '<span style="color:var(--green)">可用</span><span style="color:var(--text-tertiary);font-size:11px"> (使用系统语音引擎)</span>';
    }

    // 异步加载 voices 列表（仅用于展示详情）
    if (voices.length === 0) {
      window.speechSynthesis.onvoiceschanged = () => {
        const v = window.speechSynthesis.getVoices();
        const enV = v.filter(x => x.lang.startsWith('en'));
        if (enV.length > 0) {
          statusEl.innerHTML = `<span style="color:var(--green)">可用 (${enV.length} 个英语语音)</span>`;
        }
      };
    }
  },

  /* ============================================================
     学习计时器
     ============================================================ */
  startStudyTimer() {
    setInterval(() => {
      if (document.visibilityState === 'visible') {
        Store.addStudyTime(10); // 每10秒累计
      }
    }, 10000);
  },

  setupVisibilityTracking() {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        Store.checkInToday();
      }
    });
  }
};

/* ============================================================
   启动应用
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  UI.init();
  Store.checkInToday();

  // 注册 PWA Manifest（内联 base64，确保跨浏览器兼容）
  try {
    const manifestData = {
      name: '英语朗读',
      short_name: '英语朗读',
      description: 'PEP 人教版小学英语点读学习',
      start_url: location.href.split('?')[0],
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#FFFFFF',
      theme_color: '#007AFF',
      icons: [{
        src: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="36" fill="#007AFF"/><text x="96" y="126" font-size="100" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">A</text></svg>'),
        sizes: '192x192',
        type: 'image/svg+xml'
      }]
    };
    const jsonStr = JSON.stringify(manifestData);
    // 使用 base64 data URI 更可靠
    const b64 = btoa(unescape(encodeURIComponent(jsonStr)));
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json;base64,' + b64;
    document.head.appendChild(link);
  } catch(e) { /* ignore */ }
});

</script>
</body>
